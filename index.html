<!doctype html>
<html lang="en">
  <head>
    <!-- Basic document setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary title and description -->
    <title>LuminaNexus | A Quiet Digital Sanctuary</title>
    <meta
      name="description"
      content="LuminaNexus is a quiet digital sanctuary for sacred study, Hebrew language, contemplative art, symbolic architecture, and light."
    />
    <meta
      name="keywords"
      content="LuminaNexus, Hebrew, Tree of Life, Kabbalah, sacred study, contemplative art, IvritCode, 231 Gates, Aleph Olam, digital sanctuary"
    />
    <meta name="author" content="Richard Allen Lee" />
    <meta name="creator" content="LuminaNexus" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />

    <!-- Optional canonical URL -->
    <link rel="canonical" href="https://luminanexus.org/" />

    <!-- Favicons / icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LuminaNexus" />
    <meta property="og:title" content="LuminaNexus | A Quiet Digital Sanctuary" />
    <meta
      property="og:description"
      content="Enter a living architecture of study: Hebrew language, sacred art, contemplative learning, and symbolic design beneath the Tree of Life."
    />
    <meta property="og:url" content="https://luminanexus.org/" />
    <meta property="og:image" content="https://luminanexus.org/og/luminanexus-og.jpg" />
    <meta property="og:image:alt" content="LuminaNexus sacred Tree of Life homepage image" />

    <!-- Twitter / X sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LuminaNexus | A Quiet Digital Sanctuary" />
    <meta
      name="twitter:description"
      content="A digital sanctuary for sacred study, Hebrew letters, contemplative art, symbolic architecture, and light."
    />
    <meta name="twitter:image" content="https://luminanexus.org/og/luminanexus-og.jpg" />

    <!-- Optional web app behavior -->
    <meta name="application-name" content="LuminaNexus" />
    <meta name="apple-mobile-web-app-title" content="LuminaNexus" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Preconnects for future font hosting if needed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LuminaNexus",
        "url": "https://luminanexus.org/",
        "description": "A quiet digital sanctuary for sacred study, Hebrew language, contemplative art, symbolic architecture, and light.",
        "publisher": {
          "@type": "Organization",
          "name": "LuminaNexus"
        }
      }
    </script>
  </head>

  <body>
    <!--
      React mounts into this root element.
      Everything visual in the app will be rendered here by src/main.jsx
    -->
    <noscript>
      LuminaNexus requires JavaScript to display the living Tree, study pathways,
      and interactive sanctuary experience.
    </noscript>

    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
